[package]
name = "notepaeds"
version = "9.3.4"
description = "NotePaeds 9.3.4 Notepad Shell"
authors = ["NotePaeds"]
edition = "2021"

[lib]
name = "notepaeds_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_UI_Controls_Dialogs"] }

